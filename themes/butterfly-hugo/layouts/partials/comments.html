{{- $g := site.Params.giscus -}}
<div id="post-comment">
  {{- if and $g.repo $g.repoId $g.categoryId }}
  <script src="https://giscus.app/client.js"
    data-repo="{{ $g.repo }}"
    data-repo-id="{{ $g.repoId }}"
    data-category="{{ $g.category | default "Announcements" }}"
    data-category-id="{{ $g.categoryId }}"
    data-mapping="{{ $g.mapping | default "pathname" }}"
    data-strict="0" data-reactions-enabled="1" data-emit-metadata="0"
    data-input-position="top" data-theme="preferred_color_scheme"
    data-lang="zh-CN" data-loading="lazy" crossorigin="anonymous" async>
  </script>
  {{- end }}
</div>
